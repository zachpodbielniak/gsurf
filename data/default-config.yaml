# gsurf Default Configuration
# ~/.config/gsurf/config.yaml
#
# A GObject/GLib port of suckless surf. Settings here mirror surf's
# config.def.h (defconfig parameters, searchengines, styles, certs,
# uriparams) plus a modules: map (one entry per loadable .so module).
#
# Dump this file with:  gsurf --generate-yaml-config
# List modules with:    gsurf --list-modules

# Set to true to ignore this config file entirely (use built-in defaults).
# Equivalent to running with --no-yaml-config.
# ignore_yaml: false

# ===== Browser / general settings (core library) =====
browser:
  homepage: "about:blank"          # startup URI when none given on the CLI
  new_view_uri: "about:blank"      # URI for newly opened views/tabs
  default_zoom: 1.0                # 1.0 = 100%
  smooth_scroll: true
  fullscreen_on_start: false

# Default user agent. Empty string = engine default UA.
user_agent: ""

# ===== Web engine defaults (core; mirrors surf defconfig) =====
webkit:
  javascript: true
  images: true
  webgl: false
  webaudio: true
  media: true                      # HTML5 audio/video
  media_stream: false              # getUserMedia (camera/mic)
  webrtc: false
  plugins: false
  smooth_scrolling: true
  caret_browsing: false
  dns_prefetch: false
  hyperlink_auditing: false
  site_quirks: true
  developer_extras: false          # web inspector availability
  default_font_size: 16
  default_monospace_font_size: 13
  default_charset: "UTF-8"
  javascript_can_open_windows: false
  javascript_can_access_clipboard: false

# ===== TLS / security (core) =====
tls:
  strict: true                     # reject invalid certs by default

# ===== Storage / paths (core) =====
storage:
  cache_dir: "~/.cache/gsurf"
  data_dir: "~/.local/share/gsurf"
  download_dir: "~/Downloads"
  cookie_jar: "~/.local/share/gsurf/cookies.sqlite"
  enable_disk_cache: true

# ===== Network (core) =====
network:
  proxy:
    mode: default                  # default (system), none, custom
    uri: ""                        # e.g. socks5://127.0.0.1:9050
  do_not_track: false              # DNT: 1 header; sent only while the hardening module is enabled

# ===== Control socket (core) =====
# gsurfctl and other programs drive a running gsurf through a JSON-RPC
# socket in this process's private runtime directory
# ($XDG_RUNTIME_DIR/gsurf/<pid>-XXXXXX/control.sock, owner-only). See
# docs/control.org and docs/gsurfctl.org.
control:
  enabled: true                    # false: no socket (gsurfctl cannot see this instance)
  # name: work                     # gsurfctl -i work; a <name>.sock link next to the dirs

# ===== 3D (--lrg=3d, docs/lrg-3d.org) =====
# Every tab becomes a panel in a 3D scene.  --lrg=3d:ARRANGEMENT:ENVIRONMENT
# on the command line overrides the two ids here.
lrg:
  arrangement: carousel            # carousel | grid | free | single-panel | stack
  environment: studio              # studio | sky | workshop | cockpit | void
  background-fps: 4                # refresh rate of visible background tabs (0.2-60)
  history-depth: 8                 # back/forward pages shown in history depth (1-32)
  reading-single-tab: true         # a lone tab opens in reading mode (flat, pixel-exact)

# ===== Window (core) =====
window:
  title: gsurf
  geometry: 1024x768
  show_in_title: uri               # uri, title, both

# ===== Keybinds (core table) =====
# Keys use GDK keyval names ("r", "slash", "Return") with optional
# "Ctrl+" / "Alt+" / "Shift+" / "Super+" modifier prefixes.
#
# Bare-letter vim navigation (hjkl, gg, G, H/L) is provided by the
# `modal` module (enabled below), which is mode-aware so those keys do
# not interfere with typing in INSERT mode. The core table therefore
# binds only modified/chrome keys.
keybinds:
  "Ctrl+r": reload
  "Ctrl+Shift+r": reload-nocache
  "Escape": stop
  "Alt+Left": back
  "Alt+Right": forward
  "Ctrl+plus": zoom-in
  "Ctrl+minus": zoom-out
  "Ctrl+0": zoom-reset
  "Ctrl+f": find
  "Ctrl+g": find-next
  "Ctrl+Shift+g": find-prev
  "F11": toggle-fullscreen
  "Ctrl+q": quit
  # `?` (GDK keyval name "question") opens the live keybinding overlay.
  "question": show-keybinds
  # Open the address bar.  Under --lrg this drives the libregnum window's
  # built-in URL editor; on GTK the chromebar module handles it (Escape
  # there returns to the page).
  "o": open-prompt
  "Ctrl+l": open-prompt
  # vim line-scroll (handy when the modal module's j/k aren't desired).
  "Ctrl+e": scroll-down
  "Ctrl+y": scroll-up
  # --lrg=3d (docs/lrg-3d.org); elsewhere these keys pass through to the page.
  "Alt+Shift+a": lrg-cycle-arrangement       # next arrangement (carousel, grid, stack, free)
  "Alt+Shift+e": lrg-cycle-environment       # next environment (studio, sky, workshop, cockpit, void)
  "Alt+Shift+r": lrg-reading                 # read the tab head-on, pixel-exact
  "Alt+Shift+h": lrg-history                 # the tab's back/forward pages in depth
  "Alt+Shift+f": lrg-focus                   # fly to the current tab
  "Alt+Shift+p": lrg-pin                     # pin/unpin the current tab's panel
  "Alt+Shift+u": lrg-unpin-all               # unpin every panel
  "Alt+Shift+c": lrg-camera-reset            # default camera
  "Alt+Shift+o": lrg-overview                # pull back until every tab shows
  "Alt+Shift+Left": lrg-orbit-left
  "Alt+Shift+Right": lrg-orbit-right
  "Alt+Shift+Up": lrg-orbit-up
  "Alt+Shift+Down": lrg-orbit-down
  "Alt+Shift+z": lrg-zoom-in                 # camera closer
  "Alt+Shift+x": lrg-zoom-out                # camera away

# ===== Mousebinds (core) =====
mousebinds:
  "Button8": back                  # back thumb button
  "Button9": forward               # forward thumb button
  "Ctrl+Button1": open-new-view-background  # Ctrl-click link -> background child tab
  "Button2": open-new-view-background       # middle-click link -> background child tab
  # open-new-view opens the link in a foreground tab instead

# ===== Search engines (search-engines module) =====
search_engines:
  default: ddg
  engines:
    ddg:    { prefix: "d ", url: "https://duckduckgo.com/?q=%s" }
    google: { prefix: "g ", url: "https://www.google.com/search?q=%s" }
    wiki:   { prefix: "w ", url: "https://en.wikipedia.org/w/index.php?search=%s" }
    gh:     { prefix: "gh ", url: "https://github.com/search?q=%s" }

# ===== Per-URI parameter rules (uri-params module; surf uriparams[]) =====
uri_params:
  rules: []
  # - regex: ".*://(www\\.)?example\\.com/.*"
  #   settings: { javascript: false }

# ===== Site-specific styles (site-styles module; surf styles[]) =====
site_styles:
  default: ""
  rules: []

# ===== Certificate pins / exceptions (cert-manager module; surf certs[]) =====
cert_pins: {}

# ===== Modules =====
modules:

  # ---------- Tier 1: core/essential ----------

  search_engines:
    enabled: true
    default: ddg
    default_is_search: true        # bare words -> default engine
    engines:
      ddg:    { prefix: "d ", url: "https://duckduckgo.com/?q=%s" }
      google: { prefix: "g ", url: "https://www.google.com/search?q=%s" }

  chromebar:
    enabled: true
    key_focus: "Ctrl+l"
    mode_indicator: true           # vim mode ("-- INSERT --") left of the bar
    mode_hide_normal: false        # hide it in NORMAL mode
    mode_normal_color: "#89b4fa"
    mode_insert_color: "#a6e3a1"
    mode_follow_color: "#f9e2af"
    position: top                  # top or bottom
    bg_color: "#1e1e2e"
    fg_color: "#cdd6f4"
    accent_color: "#89b4fa"

  history:
    enabled: true
    # Omit file to use $XDG_DATA_HOME/gsurf/history.
    max_entries: 10000
    log_titles: true
    dmenu_cmd: "dmenu -l 20 -i"

  homepage:
    enabled: true
    uri: "about:blank"
    new_tab_uri: "about:blank"
    key_home: "Ctrl+Home"

  toggles:
    enabled: true
    notify_on_toggle: true
    keys:
      javascript: "Ctrl+Shift+s"
      images: "Ctrl+Shift+m"
      caret_browsing: "Ctrl+i"
      strict_tls: "Ctrl+Shift+t"
      # dark_mode: "Ctrl+Alt+d"     # forwarded to dark_mode's global toggle;
      #                             # dark_mode.key_toggle already binds it
      geolocation: "Ctrl+Shift+g"
      webgl: "Ctrl+Shift+w"

  adblock:
    enabled: false
    # uBlock Origin / Adblock Plus filter lists, parsed natively: network
    # rules, element hiding, procedural cosmetics, scriptlets, $redirect and
    # $removeparam. Fetch EasyList + uBO's lists (with their !#includes):
    #   make adblock-lists      # -> ~/.config/gsurf/adblock/*.txt
    # Lists marked trusted may use trusted-* scriptlets (uBO's own lists).
    filter_lists:
      - "~/.config/gsurf/adblock/easylist.txt"
      - "~/.config/gsurf/adblock/easyprivacy.txt"
      - { path: "~/.config/gsurf/adblock/ublock-filters.txt", trusted: true }
      - { path: "~/.config/gsurf/adblock/ublock-privacy.txt", trusted: true }
      - { path: "~/.config/gsurf/adblock/ublock-badware.txt", trusted: true }
      - { path: "~/.config/gsurf/adblock/ublock-quick-fixes.txt", trusted: true }
      - { path: "~/.config/gsurf/adblock/ublock-unbreak.txt", trusted: true }
    # Your own filters, same syntax ("My filters"; always trusted).
    filters: |
      ! example.com##.cookie-banner
    cosmetic: true                 # element hiding + procedural cosmetics
    scriptlets: true               # ##+js(...) injections
    redirects: true                # $redirect / $removeparam
    # Hosts-format lists (one host per line, or "0.0.0.0 host"): domain-level
    # blocking, including top-level navigations. Parsed identically.
    host_files:
      - "~/.config/gsurf/adblock/hosts"
    block_lists: []
    # Pre-converted WebKit content-blocker JSON (rarely needed now).
    content_filters: []
    # Sites (and their subdomains) where nothing is filtered.
    whitelist: []

  cookie_policy:
    enabled: true
    policy: no-third-party         # always, never, no-third-party
    key_toggle: "Ctrl+Shift+at"
    per_site: {}

  # Tab strip + tree-style tab sidebar (docs/tabs.org).
  tabs:
    enabled: true
    position: top                  # strip: top or bottom
    strip: true                    # false: no strip, tabs only in the sidebar
    show_single: false             # hide the strip when only one view
    key_new: "Ctrl+t"
    key_close: "Ctrl+w"
    key_next: "Ctrl+Tab"
    key_prev: "Ctrl+Shift+Tab"
    key_reopen: "Ctrl+Shift+t"
    bg_color: "#181825"            # strip/sidebar background (CSS colour)
    active_color: "#313244"        # active tab background
    fg_color: "#cdd6f4"            # tab text
    visible_color: "#1e1e2e"       # tabs shown in another pane (wmux)
    sidebar: false                 # tree sidebar shown at startup
    sidebar_position: left         # left or right
    sidebar_width: 240             # px (60-2000)
    sidebar_hides_strip: true      # hide the strip while the sidebar shows
    indent: 14                     # px per tree level (0-64)
    max_depth: 8                   # deepest drawn indentation (0-64)
    on_close_parent: promote       # promote | close_children
    wmux_groups: true              # sidebar grouped by wmux window (with wmux)
    background_label: "Background" # heading of tabs in no pane (grouped sidebar)
    key_sidebar: "Ctrl+Shift+greater"     # == Ctrl+Shift+period (Ctrl+Shift+.)
    key_collapse: "Ctrl+Shift+bracketleft"
    key_move_up: "Ctrl+Shift+Page_Up"
    key_move_down: "Ctrl+Shift+Page_Down"

  find_bar:
    enabled: true
    key_open: "slash"
    key_next: "n"
    key_prev: "N"
    match_case: false
    wrap_around: true
    highlight_color: "#f9e2af"

  # ---------- Tier 2: important ----------

  modal:
    enabled: true                  # vim-style navigation by default
    start_mode: normal             # normal or insert
    insert_keys: [i, a]            # bare keys that enter INSERT ([] = none)
    scroll_step: 40
    hint_key: "f"
    hint_key_newview: "F"
    hint_chars: "asdfghjkl"
    hint_bg: "#ffd700"
    hint_fg: "#000000"
    hint_font_size: 11  # positive integer, CSS pixels
    hint_alpha: 230

  omnibar:
    enabled: false
    max_results: 12
    rank: frecency                 # freq, recency, frecency
    match: fuzzy                   # fuzzy or prefix

  bookmarks:
    enabled: false
    file: "~/.local/share/gsurf/bookmarks"
    key_add: "Ctrl+d"
    key_open: "Ctrl+Shift+d"
    prefix: "b "                   # type "b name" in the bar to recall
    dmenu_cmd: "dmenu -l 20 -i"

  externalpipe:
    enabled: false
    commands: []
    # - key: "Ctrl+Shift+l"
    #   command: "linkextract | dmenu -l 20 | xargs -r gsurf"
    #   input: html                # html, text, uri, selection

  playexternal:
    enabled: false
    command: "mpv --"
    key: "Ctrl+m"
    also_links: true
    context_menu_entry: true

  downloads:
    enabled: true
    dir: "~/Downloads"
    ask_destination: false
    key_list: "Ctrl+j"
    notify_complete: true
    open_when_done: false

  userscripts:
    enabled: false
    global: "~/.config/gsurf/script.js"
    dir: "~/.config/gsurf/scripts"
    inject_time: end               # start or end
    rules: {}

  site_styles:
    enabled: true
    default: ""
    rules: []

  uri_params:
    enabled: false
    rules: []

  cert_manager:
    enabled: false
    store: "~/.config/gsurf/certs"
    strict: true
    key_show: "Ctrl+Shift+x"
    allow_exceptions: true
    pins: {}

  useragent:
    enabled: false
    default: ""
    key_cycle: "Ctrl+Shift+u"
    presets:
      default: ""
      firefox: "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0"
    rules: []

  notifications:
    enabled: true
    allow_web_notifications: ask    # allow, deny, ask
    urgency: normal                 # low, normal, critical
    timeout: -1
    notify_downloads: true

  # Fill forms from identity/address/card profiles (docs/form-autofill.org).
  # Card data (cc_name, cc_number, cc_exp) is only read from the private
  # profile file and only filled on https pages; the CSC is never stored.
  form_autofill:
    enabled: false
    # file: "~/.config/gsurf/autofill.yaml"  # the default; must be chmod 600
    suggest_on_focus: true          # list profile labels on a known field
    key_fill: "Ctrl+Alt+f"          # one profile: fill; several: picker
    exclude: []                     # top-level host regexes, e.g. '(^|\.)paypal\.com$'
    profiles: []                    # inline profiles (no card data here)
    # - label: home
    #   given_name: Zach
    #   family_name: Example
    #   email: zach@example.org
    #   tel: "+1 555 0100"
    #   street: ["742 Evergreen Terrace", "Apt 9"]
    #   city: Springfield
    #   region: IL
    #   postal_code: "62704"
    #   country: US

  # ---------- MCP (requires the MCP=1 build flag) ----------

  mcp:
    enabled: false
    transport: unix-socket          # unix-socket, http, stdio
    # socket_name: myproject        # gsurf-mcp-NAME.sock (default: PID-based)
    # port: 8808                     # only used with transport: http
    # host: "127.0.0.1"              # only used with transport: http

    # Per-tool enable/disable (all default to false for safety)
    tools:
      navigate: false
      get_current_uri: false
      get_title: false
      go_back: false
      go_forward: false
      reload: false
      stop: false
      get_page_text: false
      get_page_html: false
      get_links: false
      find_text: false
      execute_javascript: false     # arbitrary JS in page context
      click_link: false
      scroll: false
      list_views: false
      switch_view: false
      open_view: false
      close_view: false
      screenshot: false
      save_screenshot: false
      get_history: false
      get_cookies: false
      get_config: false
      list_modules: false
      set_config: false
      set_setting: false
      toggle_module: false
      # Views by stable id, tab tree, containers (docs/mcp.org)
      open_child_view: false
      move_view: false
      set_collapsed: false
      get_tab_tree: false
      list_containers: false
      reopen_in_container: false
      new_temporary_container_view: false
      # Input modes and any keybind action by name
      get_mode: false
      set_mode: false
      follow_hints: false
      run_action: false             # every action a key can trigger
      list_actions: false
      # wmux panes and windows (needs modules.wmux)
      wmux_status: false
      list_wmux_windows: false
      list_panes: false
      wmux_command: false           # any wmux command line
      split_pane: false
      select_pane: false
      kill_pane: false
      zoom_pane: false
      select_layout: false
      show_view_in_pane: false
      select_window: false
      new_window: false
      rename_window: false
      kill_window: false

  # ---------- Tier 3: nice-to-have ----------

  inspector:
    enabled: false
    key: "Ctrl+Shift+i"
    detached: false

  spacesearch:
    enabled: false
    engine: default

  dark_mode:
    enabled: false
    # off | native (the site's own dark theme) | filter (CSS invert) |
    # dynamic (Dark Reader). Legacy: auto, light, dark (+ force_dark_css).
    mode: filter
    brightness: 100                 # 0-200 (%); 100/100/0/0 leave colours as they are
    contrast: 100                   # 0-200 (%)
    sepia: 0                        # 0-100 (%)
    grayscale: 0                    # 0-100 (%)
    key_toggle: "Ctrl+Alt+d"        # everything on/off (dark-mode-toggle)
    key_toggle_site: "Ctrl+Alt+Shift+d"   # this site, saved (dark-mode-toggle-site)
    # Per-site rules (host regexes, first match wins; unset keys come from
    # above). Toggled sites are saved in $XDG_DATA_HOME/gsurf/dark_mode/sites.yaml.
    sites: []
    #  - match: '(^|\.)github\.com$'
    #    mode: native
    #  - match: '(^|\.)example\.org$'
    #    mode: off
    #  - match: 'news'
    #    brightness: 90
    #    sepia: 10

  status_bar:
    enabled: false
    position: bottom
    show_progress: true
    show_tls: true
    show_mode: true

  geolocation:
    enabled: false
    default: deny                   # allow, deny, ask
    per_site: {}

  # Containers: separate cookie jars / storage per tab group (like
  # Firefox Multi-Account and Temporary Containers). See docs/containers.org.
  containers:
    enabled: false
    new_tab: temporary              # temporary | default | <container id>
    inherit_opener: true            # links opened from a tab stay in its container
    temp_cleanup_delay: 30          # seconds after a temporary container's last tab
    temp_color: "#89b4fa"
    containers: []                  # e.g.
    #  - name: Media                # id defaults to the lowercased name ("media")
    #    color: "#f9e2af"
    #    hosts: ['(^|\.)youtube\.com$', '(^|\.)twitch\.tv$']
    #    proxy: socks5://127.0.0.1:1080   # http:// https:// socks4:// socks4a:// socks5:// or none
    #    proxy_ignore: [localhost]
    #    user_agent: "Mozilla/5.0 ..."    # in place of the global user agent
    # temp_proxy / temp_proxy_ignore / temp_user_agent: the same for temporary containers
    key_new_temp: "Ctrl+Alt+t"      # container-new-temp
    key_reopen_next: "Ctrl+Alt+c"   # container-reopen-next
  # LibreWolf-style privacy hardening; see docs/hardening.org.
  hardening:
    enabled: false
    https_only: true                # upgrade http:// navigations and subresources
    https_only_local: false         # also upgrade localhost/LAN/private IPs
    strip_params: [utm_*, fbclid, gclid, dclid, mc_eid, igshid, _hsenc, yclid, msclkid]
    referer: trim_cross_origin      # off, trim_cross_origin, strip_cross_origin
    gpc: true                       # Sec-GPC: 1 + navigator.globalPrivacyControl
    dnt: false                      # DNT: 1 (absent = network.do_not_track)
    no_prefetch: true               # DNS prefetch off; cancel prefetches and <a ping>
    third_party_cookies: block      # allow, block, block_all (every container)
    itp: true                       # WebKit intelligent tracking prevention
    webrtc: false                   # false forces WebRTC off
    exempt:                         # by TOP-LEVEL page host; skip: names features
      - match: '^(localhost|127\.0\.0\.1|.*\.lan)$'
        skip: [https_only]

  session:
    enabled: false
    auto_restore: false
    file: "~/.local/share/gsurf/session.yaml"   # YAML, 0600; see docs/configuration.org
    key_save: "Ctrl+Shift+s"

  # wmux: tmux-style panes, windows and a status line in one browser
  # window (docs/wmux.org). Opt in with enabled: true; C-h/j/k/l then move
  # between panes (C-l no longer opens the address bar: use o or rebind).
  wmux:
    enabled: false
    prefix: "C-b"                  # tmux ("C-a") or gsurf ("Ctrl+a") notation
    prefix_timeout: 0              # ms to wait after the prefix; 0 = wait forever
    repeat_time: 500               # ms a repeatable key works without the prefix
    display_panes_time: 1000       # ms the pane numbers (C-b q) stay (100-60000)
    bindings: {}                   # prefix table overrides: key: command ("" unbinds)
    #   "|": "split-window -h"     # e.g. vim-style splits
    #   "g": "split-window -h https://github.com"
    root_bindings: {}              # no-prefix table overrides (default C-h/j/k/l)
    repeatable: []                 # more prefix keys that repeat
    split_ratio: 50                # % of the old pane a new pane gets (1-99)
    on_pane_kill: close_tab        # close_tab | keep_tab
    on_tab_close: close_pane       # close_pane | keep_pane
    confirm_kill: true             # x and & ask y/n first
    mouse: true                    # drag the gaps between panes to resize
    remember_layout: true          # the session module saves the layout
    min_pane_pct: 10               # smallest pane, % of the window (0-50)
    gap: 2                         # px between panes (0-64)
    border_width: 1                # px, inactive panes (0-32)
    active_border_width: 2         # px, the active pane (0-32)
    border_color: "#45475a"        # panes in the default container
    active_border_color: "#89b4fa" # the active pane in the default container
    container_colors: true         # borders in the tab's container colour
    inactive_opacity: 0.55         # border alpha of inactive panes (0-1)
    active_brighten: 0.25          # container colour mixed toward white (0-1)
    status: true                   # the status line
    status_position: bottom        # bottom | top
    status_bg: "#181825"
    status_fg: "#cdd6f4"
    status_current_fg: "#89b4fa"   # the current window's entry
    window_name_max: 20            # characters of a window name (1-200)
    mode_indicator: true           # "-- INSERT --" in the status line
    mode_hide_normal: false        # hide the indicator in NORMAL mode
    mode_normal_color: "#89b4fa"
    mode_insert_color: "#a6e3a1"
    mode_follow_color: "#f9e2af"

  # --- AI modules (require the AI=1 build flag; deferred / not yet built) ---
